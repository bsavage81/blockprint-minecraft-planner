(() =&gt; {

    ['Ground walls 1','Exterior walls, central hall, and main room partitions; leave door openings.'],
    ['Ground walls 2','Continue walls and place door blocks or empty doorway cells.'],
    ['Ground windows 1','Add the lower halves of windows in the marked blue cells.'],

    ['Second-floor plate','Full 30×24 ceiling/floor plate; keep the stairwell opening clear.'],
    ['Upper floor','Finish upper flooring and begin the shallow porch-roof edge.'],
    ['Upper walls 1','Build bedroom, bath, trunk-room, and hall partitions.'],
    ['Upper windows 1','Add lower halves of upper-story windows.'],
    ['Upper windows 2','Add upper halves of windows; keep the front center ready for the dormer.'],

  root.querySelector('#s144next').addEventListener('click',()=&gt;{range.value=String(Math.min(19,Number(range.value)+1));render();});

<script>(() => {

    const data = event.data;

        typeof height === "number" &&
        Number.isFinite(height) &&
